name: Sync Delivery Zones Free 1.4.30

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-delivery-zones-free-1430.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public Free repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download current Free package from WSS update server
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://website-support.ru/wp-json/wss-updates/v1/download?product=ydzs_free' \
            --output /tmp/yd-zones-shipping-free-1.4.30.zip
          unzip -t /tmp/yd-zones-shipping-free-1.4.30.zip

      - name: Validate and publish source, ZIP and manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ydzs-release
          mkdir -p /tmp/ydzs-release
          unzip -q /tmp/yd-zones-shipping-free-1.4.30.zip -d /tmp/ydzs-release

          test -f /tmp/ydzs-release/yd-zones-shipping/yd-zones-shipping.php
          grep -q 'Version: 1.4.30' /tmp/ydzs-release/yd-zones-shipping/yd-zones-shipping.php
          grep -q "define( 'YDZS_VERSION', '1.4.30' );" /tmp/ydzs-release/yd-zones-shipping/yd-zones-shipping.php

          rm -rf plugins/delivery-zones-free
          mkdir -p plugins/delivery-zones-free
          cp -a /tmp/ydzs-release/yd-zones-shipping/. plugins/delivery-zones-free/

          mkdir -p releases/delivery-zones/free
          cp /tmp/yd-zones-shipping-free-1.4.30.zip \
            releases/delivery-zones/free/yd-zones-shipping-free-1.4.30.zip

          python3 <<'PY'
          from pathlib import Path
          import json

          path = Path('manifest.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          plugin = manifest['plugins']['ydzs_free']
          plugin['version'] = '1.4.30'
          plugin['source_path'] = 'plugins/delivery-zones-free'
          plugin['zip_path'] = 'releases/delivery-zones/free/yd-zones-shipping-free-1.4.30.zip'
          plugin['homepage'] = 'https://website-support.ru/plugins/delivery-zones-for-woocommerce/'
          plugin['package_dir'] = 'yd-zones-shipping'
          plugin['type'] = 'free'
          plugin['compression'] = 'store'
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          php -l plugins/delivery-zones-free/yd-zones-shipping.php
          unzip -t releases/delivery-zones/free/yd-zones-shipping-free-1.4.30.zip

      - name: Commit synchronized Free release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/delivery-zones-free manifest.json releases/delivery-zones/free/yd-zones-shipping-free-1.4.30.zip
          if git diff --cached --quiet; then
            echo 'No release changes to commit.'
            exit 0
          fi
          git commit -m 'Publish Delivery Zones Free 1.4.30'
          git push
