name: Publish HPOS-compatible Free packages

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-hpos-free.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
      - name: Patch public sources and manifest
        run: python3 .github/scripts/publish-hpos-free.py
      - name: Validate PHP
        run: |
          php -l plugins/bookings-schedule-free/wss-bookings-schedule.php
          php -l plugins/wss-woocommerce-bookings/wss-woocommerce-bookings.php
          grep -q "custom_order_tables" plugins/bookings-schedule-free/wss-bookings-schedule.php
          grep -q "custom_order_tables" plugins/wss-woocommerce-bookings/wss-woocommerce-bookings.php
      - name: Build deterministic STORE ZIPs
        run: |
          php -r '
          function build_zip($source,$zipPath,$packageDir){
            @mkdir(dirname($zipPath),0777,true);
            $zip=new ZipArchive();
            if($zip->open($zipPath,ZipArchive::CREATE|ZipArchive::OVERWRITE)!==true){exit(1);} 
            $root=realpath($source);
            $it=new RecursiveIteratorIterator(new RecursiveDirectoryIterator($source,FilesystemIterator::SKIP_DOTS),RecursiveIteratorIterator::SELF_FIRST);
            $entries=[];
            foreach($it as $f){$r=$f->getRealPath();$rel=str_replace(DIRECTORY_SEPARATOR,"/",substr($r,strlen($root)+1));$entries[]=[$r,$rel,$f->isDir(),$f->isFile()];}
            usort($entries,fn($a,$b)=>strcmp($a[1],$b[1]));
            foreach($entries as [$r,$rel,$isDir,$isFile]){$name=$packageDir."/".$rel;if($isDir){$zip->addEmptyDir($name);}elseif($isFile){$zip->addFile($r,$name);$zip->setCompressionName($name,ZipArchive::CM_STORE);if(method_exists($zip,"setMtimeName")){$zip->setMtimeName($name,315532800);}}}
            $zip->close();
          }
          build_zip("plugins/bookings-schedule-free","releases/bookings-schedule/free/wss-bookings-schedule-lite-0.3.19.zip","wss-bookings-schedule-lite");
          build_zip("plugins/wss-woocommerce-bookings","releases/wss-woocommerce-bookings/free/wss-woocommerce-bookings-0.5.6-free.zip","wss-woocommerce-bookings");
          '
      - name: Validate ZIPs
        run: |
          unzip -p releases/bookings-schedule/free/wss-bookings-schedule-lite-0.3.19.zip wss-bookings-schedule-lite/wss-bookings-schedule.php | grep -q "Version: 0.3.19"
          unzip -p releases/bookings-schedule/free/wss-bookings-schedule-lite-0.3.19.zip wss-bookings-schedule-lite/wss-bookings-schedule.php | grep -q "custom_order_tables"
          unzip -p releases/wss-woocommerce-bookings/free/wss-woocommerce-bookings-0.5.6-free.zip wss-woocommerce-bookings/wss-woocommerce-bookings.php | grep -q "Version: 0.5.6"
          unzip -p releases/wss-woocommerce-bookings/free/wss-woocommerce-bookings-0.5.6-free.zip wss-woocommerce-bookings/wss-woocommerce-bookings.php | grep -q "custom_order_tables"
      - name: Commit public release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins manifest.json releases
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish HPOS-compatible Free releases"
          git push
