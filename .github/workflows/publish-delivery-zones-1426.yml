name: Publish Delivery Zones 1.4.26

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-delivery-zones-1426.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update source, manifest and ZIP
        run: python3 tools/release_delivery_1426.py
      - name: Commit public release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A plugins/delivery-zones-free manifest.json releases/delivery-zones/free/yd-zones-shipping-free-1.4.26.zip
          git commit -m "Publish Delivery Zones Free 1.4.26 no-standalone-JS build"
          git push
