name: Publish WSS Bookings Schedule 0.3.7

on:
  push:
    paths:
      - '.github/workflows/publish-bookings-0.3.7.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Free ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wss-bookings-schedule-lite
          mkdir -p /tmp/wss-bookings-schedule-lite
          cp -a plugins/bookings-schedule-free/. /tmp/wss-bookings-schedule-lite/
          mkdir -p releases/bookings-schedule/free
          rm -f releases/bookings-schedule/free/wss-bookings-schedule-lite-0.3.7.zip
          (cd /tmp && zip -qr "$GITHUB_WORKSPACE/releases/bookings-schedule/free/wss-bookings-schedule-lite-0.3.7.zip" wss-bookings-schedule-lite)

      - name: Update public manifest
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('manifest.json')
          data = json.loads(path.read_text(encoding='utf-8-sig'))
          plugin = data['plugins']['wss_bookings_schedule_free']
          plugin['version'] = '0.3.7'
          plugin['zip_path'] = 'releases/bookings-schedule/free/wss-bookings-schedule-lite-0.3.7.zip'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json releases/bookings-schedule/free/wss-bookings-schedule-lite-0.3.7.zip
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Publish WSS Bookings Schedule Lite 0.3.7"
          git push
