name: Publish Delivery Zones Free 1.4.32

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-delivery-zones-1432.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install gettext
        run: sudo apt-get update -qq && sudo apt-get install -y gettext

      - name: Publish source and ZIP
        run: python3 tools/publish_delivery_1432.py

      - name: Compile translations and lint
        run: |
          msgfmt plugins/delivery-zones-free/languages/ydzs-en_US.po -o plugins/delivery-zones-free/languages/ydzs-en_US.mo
          find plugins/delivery-zones-free -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          # Rebuild after compiling the current MO so the ZIP contains it.
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_STORED
          import json
          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          p=manifest['plugins']['ydzs_free']; source=Path(p['source_path']); output=Path(p['zip_path']); root=p['package_dir']
          files=[x for x in source.rglob('*') if x.is_file() and x.name not in {'.DS_Store','Thumbs.db'} and x.suffix.lower() not in {'.bak','.log','.map'}]
          files.sort(key=lambda x:x.relative_to(source).as_posix())
          with ZipFile(output,'w',compression=ZIP_STORED,allowZip64=True) as zf:
              for x in files:
                  info=ZipInfo(f'{root}/{x.relative_to(source).as_posix()}',date_time=(1980,1,1,0,0,0)); info.compress_type=ZIP_STORED; info.create_system=3; info.external_attr=(0o100644 & 0xFFFF)<<16
                  zf.writestr(info,x.read_bytes())
          PY
          unzip -t releases/delivery-zones/free/yd-zones-shipping-free-1.4.32.zip

      - name: Commit release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/delivery-zones-free manifest.json releases/delivery-zones/free/yd-zones-shipping-free-1.4.32.zip
          git commit -m 'Publish Delivery Zones Free 1.4.32'
          git push
