name: Publish Bookings Schedule Lite 0.3.18

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-bookings-0318.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
      - name: Validate PHP
        run: php -l plugins/bookings-schedule-free/wss-bookings-schedule.php
      - name: Build deterministic STORE ZIP
        run: |
          php -r '
          $source="plugins/bookings-schedule-free";
          $zipPath="releases/bookings-schedule/free/wss-bookings-schedule-lite-0.3.18.zip";
          @mkdir(dirname($zipPath),0777,true);
          $zip=new ZipArchive();
          if($zip->open($zipPath,ZipArchive::CREATE|ZipArchive::OVERWRITE)!==true){exit(1);} 
          $root=realpath($source);
          $it=new RecursiveIteratorIterator(new RecursiveDirectoryIterator($source,FilesystemIterator::SKIP_DOTS),RecursiveIteratorIterator::SELF_FIRST);
          $entries=[];
          foreach($it as $f){$r=$f->getRealPath();$rel=str_replace(DIRECTORY_SEPARATOR,"/",substr($r,strlen($root)+1));$entries[]=[$r,$rel,$f->isDir(),$f->isFile()];}
          usort($entries,fn($a,$b)=>strcmp($a[1],$b[1]));
          foreach($entries as [$r,$rel,$isDir,$isFile]){$name="wss-bookings-schedule-lite/".$rel;if($isDir){$zip->addEmptyDir($name);}elseif($isFile){$zip->addFile($r,$name);$zip->setCompressionName($name,ZipArchive::CM_STORE);if(method_exists($zip,"setMtimeName")){$zip->setMtimeName($name,315532800);}}}
          $zip->close();
          '
      - name: Validate ZIP
        run: |
          unzip -l releases/bookings-schedule/free/wss-bookings-schedule-lite-0.3.18.zip | grep -q 'wss-bookings-schedule-lite/wss-bookings-schedule.php'
          unzip -p releases/bookings-schedule/free/wss-bookings-schedule-lite-0.3.18.zip wss-bookings-schedule-lite/wss-bookings-schedule.php | grep -q 'Version: 0.3.18'
      - name: Commit ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/bookings-schedule/free/wss-bookings-schedule-lite-0.3.18.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Bookings Schedule Lite 0.3.18 ZIP"
          git push
