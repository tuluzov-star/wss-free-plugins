name: Publish Delivery Zones Free 1.4.31

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-delivery-zones-1431.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install gettext
        run: sudo apt-get update -qq && sudo apt-get install -y gettext

      - name: Publish source and ZIP
        run: python3 tools/publish_delivery_1431.py

      - name: Verify archive
        run: unzip -t releases/delivery-zones/free/yd-zones-shipping-free-1.4.31.zip

      - name: Commit release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/delivery-zones-free manifest.json releases/delivery-zones/free/yd-zones-shipping-free-1.4.31.zip
          git commit -m 'Publish Delivery Zones Free 1.4.31'
          git push
