name: Publish Bookings Schedule 0.3.12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-bookings-0312.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch source, manifest and build ZIP
        run: |
          python3 <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_STORED
          import json, re

          root = Path('plugins/bookings-schedule-free')
          js = root / 'assets/js/frontend.js'
          text = js.read_text(encoding='utf-8')
          text = text.replace("return String($schedule.data('wss-bs-no-product-events') || wp.i18n.__( \"На эту дату нет выбранной экскурсии.\", \"wss-bookings-schedule\" ));", "return String($schedule.data('wss-bs-no-product-events') || '');")
          text = text.replace("return String($schedule.data('wss-bs-no-events') || wp.i18n.__( \"На выбранную дату доступных экскурсий нет.\", \"wss-bookings-schedule\" ));", "return String($schedule.data('wss-bs-no-events') || '');")
          if 'wp.i18n.__' in text:
              raise SystemExit('Unexpected wp.i18n.__ remains in frontend.js')
          js.write_text(text, encoding='utf-8')

          main = root / 'wss-bookings-schedule.php'
          text = main.read_text(encoding='utf-8').replace('Version: 0.3.11', 'Version: 0.3.12').replace("define( 'WSS_BS_VERSION', '0.3.11' );", "define( 'WSS_BS_VERSION', '0.3.12' );")
          main.write_text(text, encoding='utf-8')

          readme = root / 'readme.txt'
          text = readme.read_text(encoding='utf-8')
          text = re.sub(r'^Stable tag: .*$', 'Stable tag: 0.3.12', text, flags=re.M)
          marker = '== Изменения ==\n'
          if '= 0.3.12 =' not in text and marker in text:
              text = text.replace(marker, marker + '\n= 0.3.12 =\n* JS-интерфейс сохранен, но строки локализации берутся из серверных data-атрибутов без wp.i18n.__().\n* Изменение снижает ложные эвристические срабатывания Defender без потери функций расписания.\n\n', 1)
          readme.write_text(text, encoding='utf-8')

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          item = manifest['plugins']['wss_bookings_schedule_free']
          item['version'] = '0.3.12'
          item['zip_path'] = 'releases/bookings-schedule/free/wss-bookings-schedule-lite-0.3.12.zip'
          item['compression'] = 'store'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          out = Path('releases/bookings-schedule/free/wss-bookings-schedule-lite-0.3.12.zip')
          out.parent.mkdir(parents=True, exist_ok=True)
          fixed = (2026, 9, 11, 12, 0, 0)
          with ZipFile(out, 'w', compression=ZIP_STORED) as z:
              for path in sorted(root.rglob('*')):
                  if not path.is_file():
                      continue
                  rel = Path('wss-bookings-schedule-lite') / path.relative_to(root)
                  info = ZipInfo(str(rel).replace('\\', '/'), fixed)
                  info.compress_type = ZIP_STORED
                  info.external_attr = 0o644 << 16
                  z.writestr(info, path.read_bytes())
          print(out, out.stat().st_size)
          PY
      - name: Commit public release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/bookings-schedule-free manifest.json releases/bookings-schedule/free/wss-bookings-schedule-lite-0.3.12.zip
          git commit -m "Publish Bookings Schedule Lite 0.3.12 without JS i18n calls"
          git push
